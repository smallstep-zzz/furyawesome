name: Validate furyawesome catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_catalog.py
      - run: python scripts/catalog_store.py check
      - run: python scripts/validate_web_usage.py
      - run: python scripts/multi_npu.py check
      - run: python scripts/test_multi_npu.py
      - run: python scripts/lora_store.py check
      - run: python scripts/test_lora_store.py
